defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic


wandb:
  project: deepmimic
  run_name: MjxSkeletonPros_AdaptSigmd5_NoMotorTanh_seed0to2_stiff100_damp10
experiment:
  task_factory:
    name: ImitationFactory
    params:
      default_dataset_conf:
        task: walk
  env_params:
    env_name: MjxSkeletonMuscleProsthesis
    prosthesis_side: left_side
    prosthesis_type: transtibial
    joint_stiffness: 100
    joint_damping: 10
    delete_joints: false
    headless: true
    disable_arms: false
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      sites_for_mimic:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
  hidden_layers:
  - 512
  - 256
  lr: 0.0001
  num_envs: 2048
  num_steps: 200
  total_timesteps: 900000000.0
  update_epochs: 4
  result_dir: None
  checkpoint_num: 9
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.2
  learnable_std: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 2
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 100
    num_envs: 100
    num: 10
    quantities:
    - JointPosition
    - JointVelocity
    - RelSitePosition
    - RelSiteVelocity
    - RelSiteOrientation
    measures:
    - EuclideanDistance
    - DynamicTimeWarping
    - DiscreteFrechetDistance
    rel_site_names:
    - upper_body_mimic
    - left_hand_mimic
    - left_foot_mimic
    - right_hand_mimic
    - right_foot_mimic
control_config:
  torque_control:
    control_type: SkeletonMuscleControlFunction
    control_params: null


checkpoint_path: "/home/nadinebadie/loco-mujoco/prosthesis_test/outputs/2025-06-10/02-14-59/PPOJax_saved.pkl"